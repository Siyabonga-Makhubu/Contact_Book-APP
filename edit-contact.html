<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact details</title>
  </head>
  <body>
    <h1>Contact details</h1>
    <div id="avatarImage"></div>
    <form id="contact_form">
      <label for="firstname">First name:</label>
      <input type="text" id="firstname" name="firstname" maxlength="500" required readonly /><br />

      <label for="lastname">Last name:</label>
      <input type="text" id="lastname" name="lastname" maxlength="500" required readonly /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" maxlength="500" readonly /><br />

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" maxlength="500" readonly /><br />

      <label for="address">Address:</label>
      <input type="text" id="address" name="address" maxlength="500" readonly /><br />

      <label for="avatar">Change profile image (JPEG, PNG, GIF, or WebP; max 5 MB):</label>
      <input type="file" id="avatar" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp" hidden /><br />

      <button type="submit" id="submit">Save</button>
    </form>
    <p id="status" role="status"></p>
    <button id="homelink" type="button">Home</button>
    <button id="editContact" type="button">Edit</button>
    <button id="deleteContact" type="button">Delete</button>

    <script src="config.js"></script>
    <script>
      const contactId = new URLSearchParams(window.location.search).get("id");
      const form = document.getElementById("contact_form");
      form.addEventListener("submit", submitForm);
      document.getElementById("homelink").addEventListener("click", goHome);
      document.getElementById("editContact").addEventListener("click", enableEditing);
      document.getElementById("deleteContact").addEventListener("click", deleteContact);

      async function getContact() {
        const status = document.getElementById("status");
        if (!contactId || !/^[0-9]+$/.test(contactId)) {
          status.textContent = "A valid contact ID is required.";
          return;
        }
        try {
          const response = await fetch(apiPath + "contacts/" + encodeURIComponent(contactId));
          const contact = await response.json();
          if (!response.ok) throw new Error(contact.error || "Could not load contact.");
          for (const field of ["firstname", "lastname", "email", "phone", "address"]) {
            form.elements[field].value = contact[field] || "";
          }
          if (contact.avatar) {
            const image = document.createElement("img");
            image.src = uploadsPath + encodeURIComponent(contact.avatar);
            image.alt = `${contact.firstname} ${contact.lastname}`;
            image.width = 200;
            document.getElementById("avatarImage").replaceChildren(image);
          }
        } catch (error) {
          status.textContent = error.message;
        }
      }

      function goHome() {
        window.location.href = "index.html";
      }

      function enableEditing() {
        form.querySelectorAll("input:not([type=file])").forEach((input) => {
          input.readOnly = false;
        });
        form.elements.avatar.hidden = false;
        document.getElementById("submit").textContent = "Save";
        document.getElementById("editContact").disabled = true;
      }

      function readAvatar(file) {
        if (!file) return Promise.resolve(undefined);
        if (file.size > 5 * 1024 * 1024) return Promise.reject(new Error("Image must be 5 MB or smaller."));
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Could not read the selected image."));
          reader.readAsDataURL(file);
        });
      }

      async function submitForm(event) {
        event.preventDefault();
        const status = document.getElementById("status");
        const contact = Object.fromEntries(new FormData(form));
        try {
          contact.avatar = await readAvatar(form.elements.avatar.files[0]);
          const response = await fetch(apiPath + "contacts/" + encodeURIComponent(contactId), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contact),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not update contact.");
          goHome();
        } catch (error) {
          status.textContent = error.message;
        }
      }

      async function deleteContact() {
        if (!window.confirm("Are you sure you want to delete this contact?")) return;
        const status = document.getElementById("status");
        try {
          const response = await fetch(apiPath + "contacts/" + encodeURIComponent(contactId), {
            method: "DELETE",
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not delete contact.");
          goHome();
        } catch (error) {
          status.textContent = error.message;
        }
      }

      getContact();
    </script>
  </body>
</html>

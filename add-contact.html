<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add contact</title>
  </head>
  <body>
    <h1>Add contact</h1>
    <form id="contact_form">
      <label for="firstname">First name:</label>
      <input type="text" id="firstname" name="firstname" maxlength="500" required /><br />

      <label for="lastname">Last name:</label>
      <input type="text" id="lastname" name="lastname" maxlength="500" required /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" maxlength="500" /><br />

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" maxlength="500" /><br />

      <label for="address">Address:</label>
      <input type="text" id="address" name="address" maxlength="500" /><br />

      <label for="avatar">Profile image (JPEG, PNG, GIF, or WebP; max 5 MB):</label>
      <input type="file" id="avatar" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp" /><br />

      <button type="submit">Add contact</button>
    </form>
    <p id="status" role="status"></p>
    <button id="homelink" type="button">Home</button>

    <script src="config.js"></script>
    <script>
      document.getElementById("homelink").addEventListener("click", goHome);
      document.getElementById("contact_form").addEventListener("submit", submitForm);

      function goHome() {
        window.location.href = "index.html";
      }

      function readAvatar(file) {
        if (!file) return Promise.resolve(undefined);
        if (file.size > 5 * 1024 * 1024) return Promise.reject(new Error("Image must be 5 MB or smaller."));
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Could not read the selected image."));
          reader.readAsDataURL(file);
        });
      }

      async function submitForm(event) {
        event.preventDefault();
        const status = document.getElementById("status");
        const form = event.currentTarget;
        const contact = Object.fromEntries(new FormData(form));
        try {
          contact.avatar = await readAvatar(form.elements.avatar.files[0]);
          const response = await fetch(apiPath + "contacts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contact),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not add contact.");
          goHome();
        } catch (error) {
          status.textContent = error.message;
        }
      }
    </script>
  </body>
</html>
